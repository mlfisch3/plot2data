name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (test + build + review)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest suite (incl. engine-purity + accuracy)
        run: npm test

      - name: Build classic bundle (dist/)
        run: npm run build

      - name: Build Android web bundle (dist-android/ + assets sync)
        run: npm run build:android

      - name: Build single-file review page
        run: npm run build:review

      - name: Upload web bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android web assets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist-android
          path: dist-android/
          if-no-files-found: error
          retention-days: 7

      - name: Upload review build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: review
          path: review/plot2data-review.html
          if-no-files-found: error
          retention-days: 7

  android:
    name: android (apk + lint + unit tests)
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm

      # The Android Gradle Plugin 8.6.1 needs JDK 17+. The runner has multiple
      # JDKs on PATH, so pick the one we want explicitly rather than relying on
      # whichever `java` resolves - that is the usual foot-gun here.
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android installs cmdline-tools and accepts the
      # SDK licenses; the plugin versions declared in the project drive the
      # actual package install at configure time.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Cache Gradle
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Android unit tests + lint
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: npm run android:check

      - name: Build debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: npm run android:apk

      - name: Report APK size + permissions
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$apk"
          "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 dump badging "$apk" | grep -E '^(package|uses-permission|application-label|application:)' || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
